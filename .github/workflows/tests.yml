name: ci

on:
  push:
    branches: [next, master]

  pull_request:
    branches: [next, master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Enumerate packages under packages/ so the test matrix can fan out.
  list-packages:
    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: List packages
        id: set-packages
        run: |
          packages=$(find packages -maxdepth 1 -mindepth 1 -type d -printf '%f\n' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
        shell: bash

  # Build once for the whole workspace, then hand the artifacts to the
  # test matrix so each leg doesn't rebuild everything from scratch.
  build:
    needs: list-packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version resolved from `packageManager` in package.json (12.11.2)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspaces
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workspace-dist
          path: packages/*/dist
          retention-days: 1
          if-no-files-found: error

  tests:
    needs: [list-packages, build]

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        node:
          - 22 # Node 22 required for OIDC trusted publishing
        package: ${{ fromJSON(needs.list-packages.outputs.packages) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install Redis server
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only redis-smq-web-ui uses Playwright. Gate both the cache and
      # the install on this package so the other matrix legs don't pay
      # the ~150 MB download cost.
      #
      # Cache key on the pnpm lockfile hash: a @playwright/test bump
      # changes the lockfile and invalidates the cache, so the matching
      # browser binary downloads. Between bumps the step is a ~5s hit.
      # `restore-keys` gives partial benefit when a non-Playwright
      # dependency changes the lockfile.
      - name: Cache Playwright browsers
        if: matrix.package == 'redis-smq-web-ui'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # --with-deps installs the OS packages Chromium needs (libnss3,
      # libgbm1, fonts, …) that bare ubuntu-latest doesn't ship.
      # `chromium` (not all three browsers) matches playwright.config.ts's
      # single project entry.
      - name: Install Playwright Chromium
        if: matrix.package == 'redis-smq-web-ui'
        run: pnpm -F ${{ matrix.package }} exec playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: workspace-dist
          path: packages

      - name: Run tests and collect code coverage
        run: pnpm -F ${{ matrix.package }} test

      - name: Upload code coverage
        uses: codecov/codecov-action@v4
        with:
          name: codecov-${{ matrix.package }}
          flags: ${{ matrix.package }}
          directory: packages/${{ matrix.package }}/coverage
          token: ${{ secrets.CODECOV_TOKEN }}
